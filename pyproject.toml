[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "perry-beurling-spectral-sieve"
version = "1.0.0"
description = "PBSS spectral residual tool: Legendre projection diagnostics, Beurling scorecards, Gamma-weight sensitivity (not a proof of RH)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nicholas D. Perry" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]
keywords = [
  "spectral-analysis",
  "legendre",
  "residual",
  "beurling",
  "riemann-hypothesis",
  "diagnostic",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
plot = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/luckyseoul/perry-beurling-spectral-sieve"
Repository = "https://github.com/luckyseoul/perry-beurling-spectral-sieve"

[project.scripts]
pbss = "pbss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
